<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jo Silva PT · Daria Huba</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root {
  --bg:       #0A0A0A;
  --surface:  #141414;
  --card:     #1A1A1A;
  --border:   rgba(200,169,110,0.18);
  --gold:     #C8A96E;
  --gold-dim: rgba(200,169,110,0.10);
  --fg:       #F2EDE4;
  --fg-2:     rgba(242,237,228,0.62);
  --fg-3:     rgba(242,237,228,0.32);
  --success:  #22c55e;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F5F0E8; --surface: #FFFFFF; --card: #EDE8DC;
    --border: rgba(160,130,70,.20); --gold: #9A7840;
    --gold-dim: rgba(154,120,64,.09);
    --fg: #1A1612; --fg-2: rgba(26,22,18,.62); --fg-3: rgba(26,22,18,.35);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F5F0E8; --surface: #FFFFFF; --card: #EDE8DC;
  --border: rgba(160,130,70,.20); --gold: #9A7840;
  --gold-dim: rgba(154,120,64,.09);
  --fg: #1A1612; --fg-2: rgba(26,22,18,.62); --fg-3: rgba(26,22,18,.35);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  padding-left:  max(16px, env(safe-area-inset-left,  0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 36px;
  max-width: 480px;
  margin: 0 auto;
}

/* Lang toggle */
.lang-bar { display: flex; justify-content: flex-end; margin-bottom: 24px; }
.lang-wrap {
  display: flex;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.lang-btn {
  padding: 6px 14px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
  font-family: 'Oswald', system-ui, sans-serif;
  background: none; border: none; color: var(--fg-3); cursor: pointer;
  transition: color 0.15s, background 0.15s;
}
.lang-btn.active { background: var(--gold); color: #0A0A0A; border-radius: 7px; }
.lang-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Header */
.header { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 28px; }
.logo-wrap {
  width: 86px; height: 86px;
  border-radius: 50%; overflow: hidden;
  border: 1.5px solid var(--border); margin-bottom: 20px;
  background: #0a0a0a;
  box-shadow: 0 0 40px var(--gold-dim), 0 0 0 1px var(--border);
  position: relative;
}
.logo-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; display: block; }
.logo-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 52%, transparent 36%, rgba(0,0,0,0.65) 82%);
  pointer-events: none;
}
.trainer-label {
  font-family: 'Oswald', system-ui, sans-serif;
  font-size: 11px; font-weight: 500; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
}
h1 {
  font-family: 'Oswald', system-ui, sans-serif;
  font-size: 30px; font-weight: 700; line-height: 1.18;
  color: var(--fg); text-wrap: balance; margin-bottom: 10px;
}
.subtitle { font-size: 14px; color: var(--fg-2); line-height: 1.65; max-width: 310px; }

/* Stats */
.stats { display: flex; gap: 10px; margin-bottom: 20px; }
.stat {
  flex: 1; background: var(--card);
  border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 8px; text-align: center;
}
.stat-label { font-size: 10px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 5px; }
.stat-val { font-family: 'Oswald', system-ui, sans-serif; font-size: 19px; font-weight: 600; color: var(--fg); }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 14px; }
.card-title { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 16px; }

/* Link row */
.link-row { display: flex; gap: 8px; align-items: stretch; margin-bottom: 20px; }
.link-box {
  flex: 1; min-width: 0;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px;
  font-size: 11px; color: var(--fg-2); word-break: break-all; line-height: 1.5;
}
.copy-btn {
  flex-shrink: 0; background: var(--gold); color: #fff;
  border: none; border-radius: 10px; padding: 10px 16px;
  font-size: 12px; font-weight: 600;
  font-family: 'DM Sans', system-ui, sans-serif;
  cursor: pointer; transition: opacity 0.15s; white-space: nowrap;
}
.copy-btn:hover { opacity: 0.85 }
.copy-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.copy-btn.ok { background: var(--success) }

/* QR */
.qr-area { display: flex; flex-direction: column; align-items: center; gap: 10px; }
#qr-canvas canvas, #qr-canvas img { border-radius: 10px; display: block; }
.qr-hint { font-size: 11px; color: var(--fg-3); text-align: center; }

/* Install tabs */
.tabs {
  display: flex; border-bottom: 1px solid var(--border);
  margin: -6px -22px 0; padding: 0 22px;
}
.tab-btn {
  flex: 1; padding: 12px 8px; font-size: 13px; font-weight: 600;
  font-family: 'DM Sans', system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; color: var(--fg-3); background: none; border: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s;
}
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.tab-panel { display: none; padding-top: 20px; }
.tab-panel.active { display: block; }

/* Steps */
.steps { display: flex; flex-direction: column; gap: 18px; }
.step { display: flex; gap: 14px; align-items: flex-start; }
.step-n {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
  background: var(--gold-dim); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  font-family: 'Oswald', system-ui, sans-serif; color: var(--gold); margin-top: 1px;
}
.step-b { flex: 1; min-width: 0; }
.step-t {
  font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 4px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.step-d { font-size: 12px; color: var(--fg-2); line-height: 1.6; }
.chip {
  display: inline-block; background: var(--gold-dim);
  border: 1px solid var(--border); color: var(--gold);
  border-radius: 5px; padding: 1px 6px; font-size: 11px; font-weight: 600;
}

/* UI icon badge — mimics real phone buttons */
.ui-ico {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; flex-shrink: 0;
  background: var(--gold-dim); border: 1px solid var(--border);
  border-radius: 7px; color: var(--gold);
  vertical-align: middle;
}
.ui-ico svg { width: 14px; height: 14px; }

/* Footer */
.footer {
  text-align: center; font-size: 12px; color: var(--fg-3);
  line-height: 1.7; margin-top: 10px; padding-top: 20px;
  border-top: 1px solid var(--border);
}
.footer strong { color: var(--fg-2); font-weight: 500; }
</style>
</head>

  const dark = isDark();
  new QRCode(wrap, {
    text: APP_URL, width: 160, height: 160,
    colorDark:  dark ? '#C8A96E' : '#9A7840',
    colorLight: dark ? '#0A0A0A' : '#F5F0E8',
    correctLevel: QRCode.CorrectLevel.M
  });
}

function copyLink() {
  const btn = document.getElementById('copy-btn');
  const t = S[lang];
  navigator.clipboard.writeText(APP_URL).then(() => {
    btn.textContent = t.copied; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = t.copy; btn.classList.remove('ok'); }, 2000);
  }).catch(() => {
    const el = document.getElementById('link-text');
    const r = document.createRange(); r.selectNodeContents(el);
    window.getSelection()?.removeAllRanges(); window.getSelection()?.addRange(r);
    btn.textContent = t.selected;
    setTimeout(() => { btn.textContent = t.copy; }, 2000);
  });
}

function showTab(id, el) {
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + id).classList.add('active');
}

setLang(lang);
buildQR();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', buildQR);
</script>

</body>
</html>
